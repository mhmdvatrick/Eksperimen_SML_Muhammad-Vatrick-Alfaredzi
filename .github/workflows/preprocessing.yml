name: Data Preprocessing
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing script
        run: |
          cd preprocessing
          python automate_Muhammad_Vatrick_Alfaredzi.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessing/telco_churn_preprocessed/telco_churn_clean.csv
          # Akan commit hanya jika ada perubahan data
          git commit -m "Automated preprocessing: Update clean data" || exit 0
          git push
